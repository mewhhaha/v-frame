<!doctype html>
<html lang="en" class="scheme-only-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay Qwik surfaces</title>
    <style>
      :root { color-scheme: only dark; }
      * { box-sizing: border-box; }
      html, body, #app { height: 100%; margin: 0; }
      body { background: #000; color: #f5f5f5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      button, textarea { font: inherit; }
      button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid white; outline-offset: 2px; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 0; color: #f5f5f5; font-size: 1.75rem; font-weight: 500; letter-spacing: -0.035em; }
      .usage-page { width: min(100%, 48rem); margin: 0 auto; padding: 3rem 1.5rem 4rem; }
      .usage-heading { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
      .usage-heading button { min-height: 2.35rem; padding: 0.4rem 0.8rem; border: 1px solid #3a3a3a; border-radius: 999px; background: #212121; color: #b4b4b4; cursor: pointer; font-size: 0.8125rem; }
      .frontend-copy { max-width: 58ch; margin: 0.4rem 0 0; color: #a0a0a0; font-size: 0.875rem; line-height: 1.55; text-wrap: pretty; }
      .usage-overview { container-type: inline-size; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 3rem; border-block: 1px solid #252525; }
      .usage-overview article { min-width: 0; padding: 1.25rem 1.5rem; border-left: 1px solid #252525; }
      .usage-overview article:first-child { padding-left: 0; border-left: 0; }
      .usage-overview article > span { display: block; color: #a0a0a0; font-size: 0.75rem; }
      .usage-overview strong { display: block; margin-top: 0.55rem; color: #f5f5f5; font-size: 1.65rem; font-weight: 500; font-variant-numeric: tabular-nums; }
      .usage-overview small { color: #737373; font-size: 0.6875rem; }
      .usage-breakdown { margin-top: 2.5rem; }
      .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 0.65rem; border-bottom: 1px solid #252525; }
      .usage-breakdown h2 { margin-bottom: 0; color: #ececec; font-size: 0.875rem; font-weight: 500; }
      .section-heading span { color: #737373; font-size: 0.75rem; }
      table { width: 100%; border-collapse: collapse; }
      td { height: 3.75rem; border-bottom: 1px solid #1d1d1d; color: #a0a0a0; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
      td:first-child { display: flex; align-items: center; gap: 0.7rem; color: #ececec; }
      td:not(:first-child) { width: 5rem; text-align: right; }
      .frontend-mark { width: 0.6rem; height: 0.6rem; flex: none; border-radius: 0.15rem; background: #8e8e8e; }
      .angular-mark { background: #ef4444; }
      .qwik-mark { background: #8b5cf6; }
      .solid-mark { background: #3b82f6; }
      .wikipedia-preview { width: min(100%, 24rem); padding: 1rem; background: #212121; }
      .wikipedia-source { margin: 0 0 0.4rem; color: #a0a0a0; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .wikipedia-preview h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.15rem; letter-spacing: 0; }
      .wikipedia-extract { margin: 0.65rem 0 0; color: #d4d4d4; font-size: 0.8125rem; line-height: 1.55; text-wrap: pretty; }
      .wikipedia-preview a { display: inline-block; margin-top: 0.8rem; color: #ececec; font-size: 0.75rem; text-decoration: underline; text-underline-offset: 0.18rem; }
      .profile-widget { min-height: 100%; }
      .profile-trigger { display: flex; width: 100%; height: 3.4rem; min-width: 0; align-items: center; gap: 0.65rem; padding: 0.45rem 0.55rem; border: 0; border-radius: 0.5rem; background: transparent; color: #ececec; cursor: pointer; text-align: left; }
      .profile-trigger:hover { background: #212121; }
      .profile-avatar { display: grid; width: 2rem; height: 2rem; flex: none; place-items: center; border-radius: 999px; background: #7c3aed; color: white; font-size: 0.6875rem; font-weight: 600; }
      .profile-copy { display: grid; min-width: 0; gap: 0.08rem; }
      .profile-copy strong { overflow: hidden; font-size: 0.75rem; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .profile-copy small { overflow: hidden; color: #737373; font-size: 0.6875rem; text-overflow: ellipsis; white-space: nowrap; }
      .profile-more { margin-left: auto; color: #737373; }
      .account-menu { position: fixed; inset: auto auto 4.25rem 0.75rem; width: 14rem; margin: 0; padding: 0.45rem; border: 1px solid #3a3a3a; border-radius: 0.65rem; background: #212121; color: #f5f5f5; }
      .account-menu:not(:popover-open) { display: none; }
      .account-menu p { margin: 0; padding: 0.5rem 0.55rem 0.65rem; border-bottom: 1px solid #333; color: #a0a0a0; font-size: 0.75rem; }
      .account-menu button { width: 100%; min-height: 2rem; padding: 0.4rem 0.55rem; border: 0; border-radius: 0.4rem; background: transparent; color: #ececec; cursor: pointer; font-size: 0.75rem; text-align: left; }
      .account-menu button:hover { background: #303030; }
      .composer-widget { height: 100%; padding: 0.55rem 0.65rem 0.35rem; background: #212121; }
      .composer-row { display: flex; min-width: 0; height: 3.55rem; align-items: center; gap: 0.45rem; }
      .composer-widget textarea { min-width: 0; height: 2.75rem; flex: 1; resize: none; padding: 0.7rem 0.2rem; border: 0; outline: 0; background: transparent; color: #f5f5f5; font-size: 0.9375rem; line-height: 1.35; }
      .composer-widget textarea::placeholder { color: #a0a0a0; }
      .composer-widget button { display: grid; width: 2rem; height: 2rem; flex: none; padding: 0; place-items: center; border: 0; border-radius: 999px; cursor: pointer; }
      .attach-button { background: transparent; color: #d4d4d4; font-size: 1.35rem; }
      .attach-button:hover { background: #303030; }
      .send-button { background: #f5f5f5; color: #111; font-size: 1.05rem; }
      .composer-widget > p { overflow: hidden; margin: 0; color: #737373; font-size: 0.625rem; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
      @container (max-width: 34rem) { .usage-overview { grid-template-columns: 1fr; } .usage-overview article, .usage-overview article:first-child { padding: 1rem 0; border-left: 0; border-top: 1px solid #252525; } .usage-overview article:first-child { border-top: 0; } }
      @media (max-width: 36rem) {
        .usage-page { padding: 1.5rem 1rem 3rem; }
        .usage-heading { align-items: flex-start; flex-direction: column; }
        h1 { font-size: 1.55rem; }
        .frontend-copy, td, .wikipedia-extract { font-size: 1rem; }
        .usage-heading button { min-height: 3rem; font-size: 1rem; }
        .wikipedia-preview a { font-size: 0.875rem; }
        .composer-widget textarea { font-size: 1rem; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
