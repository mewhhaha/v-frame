<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qwik microfrontend</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }

      .qwik-app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #151934;
        color: #f4f0ff;
      }

      .qwik-app h1 {
        background: linear-gradient(90deg, #18b6f6, #ac7ff4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .qwik-app button {
        border: none;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        color: #151934;
        background: #ac7ff4;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
